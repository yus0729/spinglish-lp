<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Spinglish OG card 1200x630</title>
<meta name="robots" content="noindex">
<!--
  og-image.png のレイアウト元（Editorialデザイン）。
  実際の og-image.png は tools/generate-og-image.js で生成しています。
  このHTMLはブラウザで1200x630のまま確認・手動スクショする用の参照版です。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #F3F0E9;
    font-family: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    position: relative;
  }
  .display { font-family: 'Didot', 'Bodoni Moda', Georgia, serif; }
  .card { width: 1200px; height: 630px; position: relative; overflow: hidden; }

  .masthead-meta {
    position: absolute; top: 48px; left: 72px; right: 72px;
    display: flex; justify-content: space-between;
    font-size: 15px; letter-spacing: 4px; text-transform: uppercase;
    color: #77736C; font-weight: 500;
  }
  .rule-top { position: absolute; top: 86px; left: 72px; width: 1056px; height: 1.5px; background: #0A0A0A; }
  .masthead {
    position: absolute; top: 96px; left: 0; width: 1200px;
    text-align: center;
    font-size: 118px; font-weight: 700; letter-spacing: 4px;
    color: #0A0A0A; line-height: 1; text-transform: uppercase;
  }
  .rule-bottom { position: absolute; top: 228px; left: 72px; width: 1056px; height: 2.5px; background: #0A0A0A; }

  .headline {
    position: absolute; top: 282px; left: 72px;
    font-size: 53px; font-weight: 700; line-height: 1.44;
    color: #0A0A0A; letter-spacing: 0.01em;
  }
  .sub {
    position: absolute; top: 448px; left: 72px;
    font-size: 22px; font-weight: 500; color: #343330; line-height: 1.75;
  }
  .foot-rule { position: absolute; top: 552px; left: 72px; width: 560px; height: 1px; background: #0A0A0A; }
  .foot {
    position: absolute; top: 570px; left: 72px;
    font-size: 18px; font-weight: 500; color: #77736C;
  }

  .phone {
    position: absolute; top: 214px; left: 852px;
    width: 300px; height: 430px;
    border-radius: 44px; padding: 10px; background: #0B0B0B;
  }
  .phone .screen {
    width: 280px; height: 420px;
    border-radius: 34px; overflow: hidden;
  }
  .phone img { width: 100%; display: block; }
</style>
</head>
<body>
  <div class="card">
    <div class="masthead-meta display">
      <span>10 Categories — 10,000+ Drills</span>
      <span>Speaking Practice, Daily</span>
    </div>
    <div class="rule-top"></div>
    <div class="masthead display">Spinglish</div>
    <div class="rule-bottom"></div>

    <div class="headline">英語は読めるのに、<br>口から出てこない人へ。</div>
    <div class="sub">日本語のお題を見て、英語で声に出すだけ。<br>AIがその場で採点し、自然な言い換えまで返します。</div>
    <div class="foot-rule"></div>
    <div class="foot">初回7日間無料 ／ 10カテゴリ・10,000問以上 ／ iPhone</div>

    <div class="phone">
      <div class="screen"><img src="img/app/home.jpg" alt=""></div>
    </div>
  </div>
</body>
</html>
